<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Xavier IA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top, #1e3a8a, transparent 40%),
                linear-gradient(135deg, #0f172a, #111827, #020617);

            color: white;
            font-family: Arial, sans-serif;
            text-align: center;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .subtitulo {
            color: #9ca3af;
            font-size: 18px;
            margin-bottom: 35px;
        }

        .entrada {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        input {
            flex: 1;
            min-width: 0;

            padding: 15px;
            border-radius: 10px;
            border: 1px solid #374151;

            background-color: #1f2937;
            color: white;

            font-size: 16px;
            outline: none;
        }

        input::placeholder {
            color: #9ca3af;
        }

        input:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 10px rgba(96, 165, 250, 0.3);
        }

        button {
            padding: 15px 22px;

            border: none;
            border-radius: 10px;

            background-color: #2563eb;
            color: white;

            font-size: 16px;
            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            background-color: #3b82f6;
            box-shadow: 0 0 15px #3b82f6;
            transform: scale(1.05);
        }

        #resposta {
            margin-top: 30px;

            padding: 18px;

            border-radius: 10px;

            background-color: rgba(31, 41, 55, 0.7);

            font-size: 18px;
            line-height: 1.5;

            min-height: 20px;
        }

        @media (max-width: 600px) {

            body {
                padding: 20px;
            }

            h1 {
                font-size: 38px;
            }

            .subtitulo {
                font-size: 16px;
            }

            .entrada {
                flex-direction: column;
            }

            input {
                width: 100%;
                font-size: 17px;
                padding: 16px;
            }

            button {
                width: 100%;
                padding: 16px;
                font-size: 17px;
            }

            #resposta {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Xavier IA</h1>

        <div class="subtitulo">
            Seu assistente pessoal
        </div>

        <div class="entrada">

            <input
                id="pergunta"
                type="text"
                placeholder="Digite sua pergunta..."
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
            >

            <button onclick="perguntar()">Enviar</button>

        </div>

        <div id="resposta"></div>

    </div>

    <script>
        async function perguntar() {

            let pergunta = document.getElementById("pergunta").value;

            let resposta = await fetch("/perguntar", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    pergunta: pergunta
                })
            });

            let dados = await resposta.json();

            document.getElementById("resposta").innerText = dados.resposta;
        }
    </script>

</body>
</html>
